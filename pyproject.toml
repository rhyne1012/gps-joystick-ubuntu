[project]
name = "gps-joystick-ubuntu"
version = "0.1.0"
description = "Ubuntu 上的 iPhone USB GPS 定位模擬搖桿工具（支援 iOS 17+ / iOS 27，免 sudo）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pymobiledevice3>=11.63.1",
    "uvicorn>=0.30.0",
    "websockets>=13.0",
]

[project.scripts]
gps-joystick-ubuntu = "gps_joystick_ubuntu:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"
